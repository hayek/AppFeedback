name: AppFeedback
options:
  bundleIdPrefix: com.amirhayek
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release

packages:
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail
    from: 1.0.0
  AppFeedbackSDK:
    path: ../AppFeedbackSDK

targets:
  AppFeedback:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: AppFeedback
        createIntermediateGroups: true
    dependencies:
      - package: SwiftMail
        product: SwiftMail
      - package: AppFeedbackSDK
        product: AppFeedbackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirhayek.AppFeedback
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AppFeedback/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppFeedback/AppFeedback.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q7U5734Q3T

  AppFeedbackTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: AppFeedbackTests
        createIntermediateGroups: true
    dependencies:
      - target: AppFeedback_iOS
        platforms: [iOS]
      - target: AppFeedback_macOS
        platforms: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirhayek.AppFeedbackTests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q7U5734Q3T

schemes:
  AppFeedback_iOS:
    build:
      targets:
        AppFeedback_iOS: all
        AppFeedbackTests_iOS: [test]
    test:
      targets:
        - AppFeedbackTests_iOS
    run:
      config: Debug
    archive:
      config: Release

  AppFeedback_macOS:
    build:
      targets:
        AppFeedback_macOS: all
        AppFeedbackTests_macOS: [test]
    test:
      targets:
        - AppFeedbackTests_macOS
    run:
      config: Debug
    archive:
      config: Release
